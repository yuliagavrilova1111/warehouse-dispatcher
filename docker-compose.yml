version: '3.8'
services:
  db:
    image: postgres:15-alpine
    container_name: wildhack_postgres
    environment:
      POSTGRES_USER: yulia_gavrilova
      POSTGRES_PASSWORD: wildhack4295_fROvc83
      POSTGRES_DB: wildhack_db
    ports:
      - "5432:5432"
    volumes:
      - ./init-db:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wildhack_user -d wildhack_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: wildhack_app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://yulia_gavrilova:wildhack4295_fROvc83@db:5432/wildhack_db
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: